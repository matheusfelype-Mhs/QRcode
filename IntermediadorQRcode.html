      background:#f4f4f4;

      margin:0;
    }

    .card{
      background:#fff;
      padding:30px;

      box-shadow:0 5px 15px rgba(0,0,0,.2);

    }

    a{
      display:block;
      text-decoration:none;
      color:#fff;
      background:#007BFF;
      padding:15px;
      border-radius:8px;
      margin:15px 0;
      font-size:18px;
    }

    a:hover{
      background:#0056b3;
    }
  </style>
</head>
